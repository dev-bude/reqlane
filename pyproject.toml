[project]
name = "reqlane"
dynamic = ["version"]
description = "Requests between AI coding agents that own different repositories, with consumer acceptance and owner escalation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "typer>=0.12", "httpx>=0.27"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "multi-agent", "request-lifecycle"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reqlane = "reqlane.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "reqlane.__version__"}

[tool.setuptools.packages.find]
include = ["reqlane*"]

[tool.setuptools.package-data]
reqlane = ["server/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
