[project]
name = "repomoot"
dynamic = ["version"]
description = "Requests between AI coding agents that own different repositories, with consumer acceptance and owner escalation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "typer>=0.12", "httpx>=0.27"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "multi-agent", "request-lifecycle"]
authors = [{ name = "SimeonAr" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/dev-bude/repomoot"
Repository = "https://github.com/dev-bude/repomoot"
Issues = "https://github.com/dev-bude/repomoot/issues"
Protocol = "https://github.com/dev-bude/repomoot/blob/main/PROTOCOL.md"
Security = "https://github.com/dev-bude/repomoot/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repomoot = "repomoot.cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "repomoot.__version__"}

[tool.setuptools.packages.find]
include = ["repomoot*"]

[tool.setuptools.package-data]
repomoot = ["server/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
